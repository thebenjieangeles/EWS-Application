<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HPE</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="icon"
      type="image/png"
      href="./assets/68f05fd333de052854778de78d3e9d22.png"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./fonts.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#"
            ><img
              src="./assets/68f05fd333de052854778de78d3e9d22 - Copy.png"
              alt="HPE Logo"
          /></a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav ms-auto">
              <a class="nav-link" aria-current="page" href="#">Das Incentive</a>
              <a class="nav-link" href="#">Gewinnchancen</a>
              <a class="nav-link" href="#">Kontakt</a>
              <a class="nav-link" href="#">Jetzt registrieren</a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <section class="hero-section">
      <img src="./assets/hero-image.jpeg" class="img-fluid" alt="Hero image" />

      <div class="hero-text">
        <h1 class="big-h1">Willkommen zur HPE Private Lounge</h1>
        <p class="big-text">Exklusive Vorteile für unsere Partner</p>
      </div>
    </section>

    <main>
      <section class="sub-hero-section">
        <div class="container col-xxl-8 px-4 py-5">
          <div class="row flex-lg-row-reverse align-items-center g-5 py-5">
            <div class="col-10 col-sm-8 col-lg-6">
              <img
                src="./assets/AdobeStock_591468629.jpeg"
                class="d-block mx-lg-auto img-fluid"
                alt="An image of a woman standing on a rock"
                width="700"
                height="500"
                loading="lazy"
              />
            </div>
            <div class="col-lg-6">
              <h1 class="display-5 fw-bold text-body-emphasis lh-1 mb-3">
                Sichern Sie sich Tank
              </h1>
              <p class="lead">
                und Wunschgutscheine und gewinnen Sie einen spektakulären
                Aktivurlaub für 2
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
